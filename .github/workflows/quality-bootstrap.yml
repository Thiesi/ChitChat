name: Quality Baseline Bootstrap

on:
  pull_request:
    branches:
      - main

permissions:
  contents: read

jobs:
  generate:
    runs-on: ubuntu-latest

    services:
      postgres:
        image: postgres:16
        env:
          POSTGRES_DB: chitchat_quality
          POSTGRES_USER: chitchat
          POSTGRES_PASSWORD: chitchat
        ports:
          - 5432:5432
        options: >-
          --health-cmd "pg_isready -U chitchat -d chitchat_quality"
          --health-interval 10s
          --health-timeout 5s
          --health-retries 5

    env:
      APP_ENV: test
      APP_DEBUG: 1
      DB_HOST: 127.0.0.1
      DB_PORT: 5432
      DB_NAME: chitchat_quality
      DB_USER: chitchat
      DB_PASSWORD: chitchat
      DB_SSLMODE: disable
      SESSION_COOKIE_SECURE: 0
      ATTACHMENT_STORAGE_PATH: /tmp/chitchat-quality-uploads
      CHITCHAT_BASE_URL: http://localhost:8080
      WEBAUTHN_RP_ID: localhost
      WEBAUTHN_ORIGIN: http://localhost:8080
      RATE_LIMIT_REGISTRATION_MAX_ATTEMPTS: 100

    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-node@v4
        with:
          node-version: '24'

      - uses: shivammathur/setup-php@v2
        with:
          php-version: '8.4'
          extensions: fileinfo, mbstring, pdo_pgsql
          coverage: none
          tools: composer:v2

      - run: composer install --no-interaction --prefer-dist
      - run: composer migrate
      - name: Resolve locked browser dependencies
        run: npm install --package-lock-only --ignore-scripts --no-audit --no-fund
      - name: Upload generated npm lockfile
        uses: actions/upload-artifact@v4
        with:
          name: quality-package-lock
          path: package-lock.json
          retention-days: 7
      - run: npm install --ignore-scripts --no-audit --no-fund
      - run: npx playwright install --with-deps chromium
      - name: Start ChitChat test server
        run: |
          mkdir -p "$ATTACHMENT_STORAGE_PATH"
          chmod 700 "$ATTACHMENT_STORAGE_PATH"
          PHP_CLI_SERVER_WORKERS=8 php -S 127.0.0.1:8080 -t public > php-server.log 2>&1 &
          echo $! > php-server.pid
          curl --fail --retry 30 --retry-delay 1 --retry-all-errors http://localhost:8080/ready.php
      - name: Generate pinned Chromium visual baselines
        run: npm run test:e2e -- tests/e2e/zzzzzzzzz-visual.spec.js --project=chromium --update-snapshots=all
      - name: Upload visual baselines
        uses: actions/upload-artifact@v4
        with:
          name: quality-visual-baselines
          path: tests/e2e/zzzzzzzzz-visual.spec.js-snapshots/
          if-no-files-found: error
          retention-days: 7
      - name: Upload bootstrap diagnostics
        if: failure()
        uses: actions/upload-artifact@v4
        with:
          name: quality-bootstrap-diagnostics
          path: |
            php-server.log
            playwright-report/
            test-results/
          if-no-files-found: ignore
          retention-days: 7
