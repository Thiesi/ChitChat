name: CI

on:
  push:
    branches:
      - main
  pull_request:

permissions:
  contents: read

jobs:
  static:
    runs-on: ubuntu-latest

    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-node@v4
        with:
          node-version: '24'
          cache: npm

      - uses: shivammathur/setup-php@v2
        with:
          php-version: '8.4'
          extensions: fileinfo, mbstring, pdo_pgsql
          coverage: none
          tools: composer:v2

      - run: composer install --no-interaction --prefer-dist
      - run: composer lint
      - name: Check JavaScript syntax
        run: |
          find public/assets/js tests/e2e -type f -name '*.js' -print0 | xargs -0 -n1 node --check
          node --check playwright.config.js
      - name: Run PHPStan
        run: |
          set -o pipefail
          composer analyse -- --error-format=raw 2>&1 | tee phpstan-output.txt
      - name: Upload PHPStan diagnostics
        if: failure()
        uses: actions/upload-artifact@v4
        with:
          name: phpstan-output
          path: phpstan-output.txt
          retention-days: 7

  integration:
    runs-on: ubuntu-latest

    services:
      postgres:
        image: postgres:16
        env:
          POSTGRES_DB: chitchat_test
          POSTGRES_USER: chitchat
          POSTGRES_PASSWORD: chitchat
        ports:
          - 5432:5432
        options: >-
          --health-cmd "pg_isready -U chitchat -d chitchat_test"
          --health-interval 10s
          --health-timeout 5s
          --health-retries 5

    env:
      APP_ENV: test
      APP_DEBUG: 1
      DB_HOST: 127.0.0.1
      DB_PORT: 5432
      DB_NAME: chitchat_test
      DB_USER: chitchat
      DB_PASSWORD: chitchat
      DB_SSLMODE: disable

    steps:
      - uses: actions/checkout@v4

      - uses: shivammathur/setup-php@v2
        with:
          php-version: '8.4'
          extensions: fileinfo, mbstring, pdo_pgsql
          coverage: none
          tools: composer:v2

      - run: composer install --no-interaction --prefer-dist
      - run: composer migrate
      - name: Run PHPUnit
        run: |
          set -o pipefail
          composer test 2>&1 | tee phpunit-output.txt
      - name: Exercise maintenance dry run
        run: composer maintenance:dry-run
      - name: Upload PHPUnit diagnostics
        if: failure()
        uses: actions/upload-artifact@v4
        with:
          name: phpunit-output
          path: phpunit-output.txt
          retention-days: 7

  browser:
    runs-on: ubuntu-latest

    services:
      postgres:
        image: postgres:16
        env:
          POSTGRES_DB: chitchat_browser
          POSTGRES_USER: chitchat
          POSTGRES_PASSWORD: chitchat
        ports:
          - 5432:5432
        options: >-
          --health-cmd "pg_isready -U chitchat -d chitchat_browser"
          --health-interval 10s
          --health-timeout 5s
          --health-retries 5

    env:
      APP_ENV: test
      APP_DEBUG: 1
      DB_HOST: 127.0.0.1
      DB_PORT: 5432
      DB_NAME: chitchat_browser
      DB_USER: chitchat
      DB_PASSWORD: chitchat
      DB_SSLMODE: disable
      SESSION_COOKIE_SECURE: 0
      ATTACHMENT_STORAGE_PATH: /tmp/chitchat-browser-uploads
      CHITCHAT_BASE_URL: http://127.0.0.1:8080

    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-node@v4
        with:
          node-version: '24'
          cache: npm

      - uses: shivammathur/setup-php@v2
        with:
          php-version: '8.4'
          extensions: fileinfo, mbstring, pdo_pgsql
          coverage: none
          tools: composer:v2

      - run: composer install --no-interaction --prefer-dist
      - run: composer migrate
      - run: npm ci --no-audit --no-fund
      - run: npx playwright install --with-deps chromium
      - name: Start ChitChat test server
        run: |
          mkdir -p "$ATTACHMENT_STORAGE_PATH"
          chmod 700 "$ATTACHMENT_STORAGE_PATH"
          PHP_CLI_SERVER_WORKERS=8 php -S 127.0.0.1:8080 -t public > php-server.log 2>&1 &
          echo $! > php-server.pid
          curl --fail --retry 30 --retry-delay 1 --retry-all-errors http://127.0.0.1:8080/ready.php
      - name: Run Chromium end-to-end tests
        run: npm run test:e2e
      - name: Upload browser diagnostics
        if: failure()
        uses: actions/upload-artifact@v4
        with:
          name: browser-diagnostics
          path: |
            php-server.log
            playwright-report/
            test-results/
          if-no-files-found: ignore
          retention-days: 7

  publish-release:
    if: github.event_name == 'pull_request' && github.head_ref == 'release/publish-v1.0.0-rc.1'
    needs:
      - static
      - integration
      - browser
    runs-on: ubuntu-latest
    permissions:
      contents: write
    env:
      RELEASE_COMMIT: 827c29d458e2d4c19e9e08fd8df5265e496219d8
      RELEASE_TAG: v1.0.0-rc.1
      SOURCE_BRANCH: ${{ github.head_ref }}

    steps:
      - uses: actions/checkout@v4
        with:
          ref: 827c29d458e2d4c19e9e08fd8df5265e496219d8
          fetch-depth: 0

      - name: Create annotated tag and pre-release
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          set -euo pipefail
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"

          if git ls-remote --exit-code --tags origin "refs/tags/${RELEASE_TAG}" >/dev/null 2>&1; then
            resolved=$(git ls-remote origin "refs/tags/${RELEASE_TAG}^{}" | awk '{print $1}')
            if [ -z "$resolved" ]; then
              resolved=$(git ls-remote origin "refs/tags/${RELEASE_TAG}" | awk '{print $1}')
            fi
            test "$resolved" = "$RELEASE_COMMIT"
          else
            git tag -a "$RELEASE_TAG" "$RELEASE_COMMIT" -m "ChitChat ${RELEASE_TAG}"
            git push origin "refs/tags/${RELEASE_TAG}"
          fi

          if ! gh release view "$RELEASE_TAG" >/dev/null 2>&1; then
            gh release create "$RELEASE_TAG" \
              --verify-tag \
              --prerelease \
              --title "ChitChat v1.0.0-rc.1" \
              --notes-file docs/releases/v1.0.0-rc.1.md
          fi

      - name: Remove publication branch
        if: success()
        run: git push origin --delete "$SOURCE_BRANCH"
