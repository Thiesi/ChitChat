name: CI

on:
  push:
    branches:
      - main
  pull_request:

permissions:
  contents: read

jobs:
  static:
    runs-on: ubuntu-latest

    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-node@v4
        with:
          node-version: '24'

      - uses: shivammathur/setup-php@v2
        with:
          php-version: '8.4'
          extensions: fileinfo, mbstring, pdo_pgsql
          coverage: none
          tools: composer:v2

      - run: composer install --no-interaction --prefer-dist
      - run: composer lint
      - name: Check JavaScript syntax
        run: |
          find public/assets/js tests/e2e -type f -name '*.js' -print0 | xargs -0 -n1 node --check
          node --check playwright.config.js
      - name: Run PHPStan
        run: |
          set -o pipefail
          composer analyse -- --error-format=raw 2>&1 | tee phpstan-output.txt
      - name: Upload PHPStan diagnostics
        if: failure()
        uses: actions/upload-artifact@v4
        with:
          name: phpstan-output
          path: phpstan-output.txt
          retention-days: 7

  integration:
    runs-on: ubuntu-latest

    services:
      postgres:
        image: postgres:16
        env:
          POSTGRES_DB: chitchat_test
          POSTGRES_USER: chitchat
          POSTGRES_PASSWORD: chitchat
        ports:
          - 5432:5432
        options: >-
          --health-cmd "pg_isready -U chitchat -d chitchat_test"
          --health-interval 10s
          --health-timeout 5s
          --health-retries 5

    env:
      APP_ENV: test
      APP_DEBUG: 1
      DB_HOST: 127.0.0.1
      DB_PORT: 5432
      DB_NAME: chitchat_test
      DB_USER: chitchat
      DB_PASSWORD: chitchat
      DB_SSLMODE: disable

    steps:
      - uses: actions/checkout@v4

      - uses: shivammathur/setup-php@v2
        with:
          php-version: '8.4'
          extensions: fileinfo, mbstring, pdo_pgsql
          coverage: none
          tools: composer:v2

      - run: composer install --no-interaction --prefer-dist
      - run: composer migrate
      - name: Run PHPUnit
        run: |
          set -o pipefail
          composer test 2>&1 | tee phpunit-output.txt
      - name: Exercise maintenance dry run
        run: composer maintenance:dry-run
      - name: Upload PHPUnit diagnostics
        if: failure()
        uses: actions/upload-artifact@v4
        with:
          name: phpunit-output
          path: phpunit-output.txt
          retention-days: 7

  browser:
    runs-on: ubuntu-latest

    services:
      postgres:
        image: postgres:16
        env:
          POSTGRES_DB: chitchat_browser
          POSTGRES_USER: chitchat
          POSTGRES_PASSWORD: chitchat
        ports:
          - 5432:5432
        options: >-
          --health-cmd "pg_isready -U chitchat -d chitchat_browser"
          --health-interval 10s
          --health-timeout 5s
          --health-retries 5

    env:
      APP_ENV: test
      APP_DEBUG: 1
      DB_HOST: 127.0.0.1
      DB_PORT: 5432
      DB_NAME: chitchat_browser
      DB_USER: chitchat
      DB_PASSWORD: chitchat
      DB_SSLMODE: disable
      SESSION_COOKIE_SECURE: 0
      ATTACHMENT_STORAGE_PATH: /tmp/chitchat-browser-uploads
      CHITCHAT_BASE_URL: http://127.0.0.1:8080

    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-node@v4
        with:
          node-version: '24'

      - uses: shivammathur/setup-php@v2
        with:
          php-version: '8.4'
          extensions: fileinfo, mbstring, pdo_pgsql
          coverage: none
          tools: composer:v2

      - run: composer install --no-interaction --prefer-dist
      - run: composer migrate
      - run: npm install --no-audit --no-fund
      - run: npx playwright install --with-deps chromium
      - name: Start ChitChat test server
        run: |
          mkdir -p "$ATTACHMENT_STORAGE_PATH"
          chmod 700 "$ATTACHMENT_STORAGE_PATH"
          PHP_CLI_SERVER_WORKERS=8 php -S 127.0.0.1:8080 -t public > php-server.log 2>&1 &
          echo $! > php-server.pid
          curl --fail --retry 30 --retry-delay 1 --retry-all-errors http://127.0.0.1:8080/ready.php
      - name: Run Chromium end-to-end tests
        run: npm run test:e2e
      - name: Upload browser diagnostics
        if: failure()
        uses: actions/upload-artifact@v4
        with:
          name: browser-diagnostics
          path: |
            php-server.log
            playwright-report/
            test-results/
          if-no-files-found: ignore
          retention-days: 7
