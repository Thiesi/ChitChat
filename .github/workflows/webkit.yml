name: WebKit

on:
  push:
    branches:
      - main
  pull_request:

permissions:
  contents: read

jobs:
  browser-webkit:
    runs-on: ubuntu-latest

    services:
      postgres:
        image: postgres:16
        env:
          POSTGRES_DB: chitchat_webkit
          POSTGRES_USER: chitchat
          POSTGRES_PASSWORD: chitchat
        ports:
          - 5432:5432
        options: >-
          --health-cmd "pg_isready -U chitchat -d chitchat_webkit"
          --health-interval 10s
          --health-timeout 5s
          --health-retries 5

    env:
      APP_ENV: test
      APP_DEBUG: 1
      DB_HOST: 127.0.0.1
      DB_PORT: 5432
      DB_NAME: chitchat_webkit
      DB_USER: chitchat
      DB_PASSWORD: chitchat
      DB_SSLMODE: disable
      SESSION_COOKIE_SECURE: 0
      ATTACHMENT_STORAGE_PATH: /tmp/chitchat-webkit-uploads
      CHITCHAT_BASE_URL: http://127.0.0.1:8080
      MESSAGE_REVISION_REVIEW_ENABLED: 1
      RATE_LIMIT_REGISTRATION_MAX_ATTEMPTS: 100
      # Many specs confirm sensitive actions as the same administrator within one window.
      RATE_LIMIT_PRIVILEGED_STEP_UP_MAX_ATTEMPTS: 100
      REGISTRATION_MIN_FILL_SECONDS: 0
      REGISTRATION_PROOF_OF_WORK_BITS: 8

    steps:
      - uses: actions/checkout@v7

      - uses: actions/setup-node@v7
        with:
          node-version: '24'
          cache: npm

      - uses: shivammathur/setup-php@v2
        with:
          php-version: '8.4'
          extensions: fileinfo, gd, mbstring, pdo_pgsql
          coverage: none
          tools: composer:v2

      - run: composer install --no-interaction --prefer-dist
      - run: composer migrate
      - run: npm ci --no-audit --no-fund
      - run: npx playwright install --with-deps webkit
      - name: Install Nginx and PHP-FPM
        run: |
          sudo apt-get update
          sudo apt-get install -y nginx php-fpm php-pgsql php-mbstring
      # Served as in production: php -S workers can hold a request behind a
      # long-lived SSE stream they accepted at the same moment.
      - name: Start ChitChat behind Nginx and PHP-FPM
        run: |
          mkdir -p "$ATTACHMENT_STORAGE_PATH"
          chmod 700 "$ATTACHMENT_STORAGE_PATH"
          source tests/stabilization/nginx-php-fpm.sh
          start_nginx_php_fpm "$RUNNER_TEMP/chitchat-server" 32
          curl --fail --retry 30 --retry-delay 1 --retry-all-errors http://127.0.0.1:8080/ready.php
      - name: Run WebKit end-to-end tests
        run: npm run test:e2e -- --project=webkit
      - name: Make server logs readable
        if: failure()
        run: sudo chmod -R a+rX "$RUNNER_TEMP/chitchat-server"
      - name: Upload WebKit diagnostics
        if: failure()
        uses: actions/upload-artifact@v7
        with:
          name: browser-diagnostics-webkit
          path: |
            ${{ runner.temp }}/chitchat-server/*.log
            playwright-report/
            test-results/
          if-no-files-found: ignore
          retention-days: 7
