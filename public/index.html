<!doctype html>
<html lang="en" data-theme="auto">
<head>
  <meta charset="utf-8"><meta name="viewport" content="width=device-width, initial-scale=1">
  <title>ChitChat</title>
  <style>
    :root{ --bg:#0b0c10; --panel:#111827; --panel2:#0f172a; --border:#1f2937; --fg:#e5e7eb; --muted:#9ca3af; --acc:#22c55e; --accent2:#22d3ee; --accent3:#a78bfa; --bad:#ef4444; --ok:#34d399; --me:#0d1b2a; --other:#101e33; --toast:#111827; --toastBorder:#334155; }
    [data-theme="light"]{ --bg:#f7fafc; --panel:#ffffff; --panel2:#f1f5f9; --border:#e5e7eb; --fg:#0f172a; --muted:#475569; --me:#e8f3ff; --other:#eef2ff; --toast:#ffffff; --toastBorder:#e5e7eb; }
    body{ margin:0; font-family: system-ui,-apple-system,Segoe UI,Roboto,Ubuntu,Cantarell,sans-serif; background:var(--bg); color:var(--fg); }
    header{ padding:10px 14px; background:linear-gradient(90deg,var(--panel),#0ea5e97a); border-bottom:1px solid var(--border); display:flex; align-items:center; justify-content:space-between; }
    main{ display:grid; grid-template-columns: 360px 1fr; height: calc(100vh - 48px); }
    aside{ border-right:1px solid var(--border); background:var(--panel2); padding:12px; overflow:auto; }
    .card{ background:var(--panel); border:1px solid var(--border); border-radius:12px; padding:12px; margin-bottom:12px; }
    input, button, textarea, select { font-size:14px; padding:8px 10px; border-radius:8px; border:1px solid #374151; background:var(--bg); color:var(--fg); }
    button { cursor:pointer; } button.primary { background: var(--panel2); border-color: var(--accent2); }
    .row{ display:flex; gap:8px; flex-wrap:wrap; align-items:center; }
    .list .item{ padding:8px; border:1px solid var(--border); border-radius:8px; margin-bottom:8px; background:var(--bg); }
    .pill{ padding:2px 8px; border-radius:999px; border:1px solid var(--border); }
    #chat{ flex:1; overflow:auto; border:1px solid var(--border); border-radius:8px; padding:8px; }
    .msg{ padding:6px 8px; border-bottom:1px dashed var(--border); border-left:4px solid transparent; border-radius:6px; margin:4px 0; }
    .msg.me{ background:var(--me); border-left-color: var(--accent2); }
    .msg.other{ background:var(--other); border-left-color: var(--accent3); }
    .msg.system .text{ color:#f3f4f6; opacity:0.9; }
    .msg.emote .text{ font-style:italic; opacity:0.95; }
    .meta{ opacity:.8; font-size:12px; }
    .hidden{ display:none; }
    .modal{ position:fixed; inset:0; background:#0008; display:none; align-items:center; justify-content:center}
    .modal.open{ display:flex }
    .banner{ background:#7c2d12; color:#fff; padding:6px 10px; border-bottom:1px solid #b45309 }
    /* Toasts */
    #toasts{ position:fixed; right:16px; bottom:16px; display:flex; flex-direction:column; gap:10px; z-index: 9999; }
    .toast{ min-width:280px; max-width: 420px; background: var(--toast); color: var(--fg); border:1px solid var(--toastBorder); border-radius:12px; padding:10px 12px; box-shadow: 0 10px 25px rgba(0,0,0,.35); display:flex; align-items:flex-start; gap:10px; opacity:0; transform: translateY(10px); transition: opacity .18s ease, transform .18s ease; }
    .toast.show{ opacity:1; transform: translateY(0); }
    .toast .icon{ font-weight:700; }
    .toast .body{ flex:1 }
    .toast .close{ cursor:pointer; border:none; background:transparent; color:var(--muted); font-size:18px; line-height:1; }
    .toast.info{ border-left: 4px solid #0ea5e9; }
    .toast.success{ border-left: 4px solid #22c55e; }
    .toast.warn{ border-left: 4px solid #f59e0b; }
    .toast.error{ border-left: 4px solid #ef4444; }
  </style>
</head>
<body>
<div id="shutdown-banner" class="hidden banner"></div>
<header>
  <div><strong id="title-text">ChitChat</strong> <span id="motd" class="meta"></span></div>
  <div class="row">
    <label>Theme <select id="theme-select"><option value="auto">Auto</option><option value="light">Light</option><option value="dark">Dark</option></select></label>
    <label>Timezone <select id="tz-select"></select></label>
    <label class="hidden" id="ping-label"><input type="checkbox" id="notify-pings"> Notify on /ping</label> <label class="hidden" id="sound-ping-label"><input type="checkbox" id="sound-ping"> Sound: /ping</label> <label class="hidden" id="sound-bc-label"><input type="checkbox" id="sound-broadcast"> Sound: broadcast</label> <label class="hidden" id="vol-ping-label">Vol: /ping <input id="vol-ping" type="range" min="0" max="100" value="70"> <button id="btn-test-ping">Test</button></label> <label class="hidden" id="vol-bc-label">Vol: broadcast <input id="vol-bc" type="range" min="0" max="100" value="70"> <button id="btn-test-bc">Test</button></label>
    <span id="user-label" class="hidden"></span>
    <button id="open-settings" class="hidden">Settings</button> <button id="logout-btn" class="hidden">Logout</button>
  </div>
</header>

<main>
  <aside>
    <div class="card" id="auth-card">
      <div class="row"><input id="login-username" placeholder="Username"><input id="login-password" type="password" placeholder="Password"><button id="login-btn" class="primary">Login</button></div>
      <div class="row" style="margin-top:6px"><input id="reg-username" placeholder="New username"><input id="reg-password" type="password" placeholder="New password"><button id="register-btn">Register</button></div>
      <div class="row" style="margin-top:6px">
        <input id="reg-birthday" type="date" aria-label="Birthday">
        <input id="reg-location" placeholder="Location (optional)">
        <select id="reg-sex"><option value="">Sex (optional)</option><option>male</option><option>female</option><option>other</option></select>
      </div>
      <div id="closed-note" class="meta hidden"></div>
    </div>

    <div class="card hidden" id="nav-card">
      <div class="meta">Rooms</div>
      <div id="rooms" class="list"></div>

      <div class="meta">Admin Tools</div>
      <div id="admin-card" class="hidden">
        <div class="row">
          <button id="adm-broadcast">Broadcast</button>
          <button id="adm-room-editor" onclick="location.href='rooms.html'">Room Editor</button> <button onclick="location.href='user.html'">User Editor</button> <button onclick="location.href='dm.html'">DM Viewer</button> <button onclick="location.href='audit.html'">Login Audit</button> <button onclick="location.href='export_logs.html'">Export Logs</button>
        </div>
      </div>

      <div class="meta">Super-Admin</div>
      <div id="sa-card" class="hidden">
        <div class="row"><button onclick="location.href='sa.html'">Open Super‑Admin Settings</button></div>
          <div class="row">
          <label>Password policy
            <select id="sa-pass-policy">
              <option value="none">none</option>
              <option value="low">low</option>
              <option value="medium">medium</option>
              <option value="high">high</option>
            </select>
          </label>
          <label>Default timezone
            <select id="sa-default-tz"></select>
          </label>
        </div>
        <div class="row">
          <label>Max attachment (MB) <input type="number" id="sa-max-attach" min="0" step="1" style="width:120px"></label>
          <label>Inactivity (min) <input type="number" id="sa-inact-min" min="0" step="1" style="width:120px"></label>
        </div>
        <div class="row">
          <label>Shutdown in (seconds, optional) <input type="number" id="sa-shutdown-sec" min="0" step="10" style="width:160px"></label>
          <label>Message (optional) <input id="sa-shutdown-msg" style="min-width:240px"></label>
          <button id="sa-shutdown" class="primary">Shutdown</button>
        </div>
      </div>
    </div>
  </aside>

  <section class="content">
    <div id="scope-header" class="meta"></div>
    <div id="chat" class="card"></div>
    <div class="row">
      <input id="message" placeholder="Type a message…" style="flex:1;">
      <input id="file" type="file" style="max-width:220px">
      <button id="send-btn" class="primary">Send</button>
    </div>
    <div id="status" class="meta"></div>
  </section>
</main>

<!-- Broadcast modal -->
<div id="broadcast-modal" class="modal">
  <div style="background:var(--panel);border:1px solid var(--border);border-radius:12px;padding:12px;min-width:420px">
    <div class="row"><strong>Broadcast message</strong><span class="meta">(Chat Admin+, GMod: rooms only)</span></div>
    <div class="row"><textarea id="bc-text" style="width:100%;height:80px" placeholder="Your announcement…"></textarea></div>
    <div class="row">
      <label><input type="radio" name="bc-mode" value="all_users" checked> All logged-in users</label>
      <label><input type="radio" name="bc-mode" value="all_rooms"> All rooms</label>
      <label><input type="radio" name="bc-mode" value="rooms"> Selected rooms</label>
    </div>
    <div class="row" id="bc-room-picker" style="display:none">
      <select id="bc-rooms" multiple size="6" style="min-width:380px"></select>
    </div>
    <div class="row" style="justify-content:flex-end">
      <button id="bc-cancel">Cancel</button>
      <button id="bc-send" class="primary">Send</button>
    </div>
  </div>
</div>

<!-- Room editor modal (kept) -->
<div id="room-modal" class="modal">
  <div style="background:var(--panel);border:1px solid var(--border);border-radius:12px;padding:12px;min-width:520px">
    <div class="row"><strong>Room Settings</strong><span class="meta" id="room-modal-title"></span></div>
    <div class="row">
      <label>Name <input id="rm-name"></label>
      <label>Info <input id="rm-info" style="min-width:240px"></label>
    </div>
    <div class="row">
      <label><input type="checkbox" id="rm-invisible"> Invisible</label>
      <label>Min age <input type="number" id="rm-age" min="0" step="1" style="width:100px"></label>
    </div>
    <hr>
    <div class="row"><strong>Attachments</strong></div>
    <div class="row">
      <label><input type="checkbox" id="rm-attach-exempt"> Exempt from system max (Chat Admin+)</label>
      <label>Override (MB) <input type="number" id="rm-attach-override" min="0" step="1" style="width:120px"></label>
    </div>
    <div class="row"><strong>Inactivity</strong></div>
    <div class="row">
      <label><input type="checkbox" id="rm-inact-exempt"> Exempt from system default (Chat Admin+)</label>
      <label>Timeout (min) <input type="number" id="rm-inact-min" min="0" step="1" style="width:120px"></label>
    </div>
    <div class="row" style="justify-content:flex-end">
      <button id="rm-cancel">Close</button>
      <button id="rm-save" class="primary">Save</button>
    </div>
  </div>
</div>


<!-- Settings modal -->
<div id="settings-modal" class="modal">
  <div style="background:var(--panel);border:1px solid var(--border);border-radius:12px;padding:14px;min-width:420px;max-width:620px">
    <div style="display:flex;justify-content:space-between;align-items:center;margin-bottom:8px">
      <strong>User Settings</strong>
      <button id="settings-close" style="border:none;background:transparent;color:var(--muted);font-size:18px;cursor:pointer">×</button>
    </div>
    <div class="row">
      <label><input type="checkbox" id="us-notify-pings"> Notify on /ping</label>
      <label><input type="checkbox" id="us-sound-ping"> Sound: /ping</label>
      <label><input type="checkbox" id="us-sound-bc"> Sound: broadcast</label>
    </div>
    <div class="row">
      <label>Theme
        <select id="us-theme">
          <option value="auto">Auto</option>
          <option value="light">Light</option>
          <option value="dark">Dark</option>
        </select>
      </label>
      <label>Timezone
        <select id="us-timezone"></select>
      </label>
    </div>
    <div class="row" style="align-items:center">
      <label style="min-width:220px">Vol: /ping <input id="us-vol-ping" type="range" min="0" max="100"></label>
      <button id="us-test-ping">Test ping</button>
    </div>
    <div class="row" style="align-items:center">
      <label style="min-width:220px">Vol: broadcast <input id="us-vol-bc" type="range" min="0" max="100"></label>
      <button id="us-test-bc">Test broadcast</button>
    </div>
    <div class="row" style="justify-content:flex-end">
      <button id="us-save" class="primary">Save</button>
    </div>
  </div>
</div>

<!-- Toast container -->
<div id="toasts" aria-live="polite" aria-atomic="true"></div>

<script type="module">import { toast } from './js/toast.js'; import { api, setCsrf } from './js/api.js'; window.toast = toast;
const API = '../backend';
let csrf=null, me=null, evtSource=null, currentRoomId=null, currentRoomName=null, lastId=0, evLast=0, systemTz='UTC', systemClosed=false, shutdownActive=false, shutdownMsg='';
const el=id=>document.getElementById(id); const chat=el('chat');
function eh(s){return (s||'').replace(/[&<>"']/g,c=>({'&':'&amp;','<':'&lt;','>':'&gt;','"':'&quot;',"'":'&#39;'}[c]));}
async function api(path, method='GET', body=null, isForm=false){
  const opt={method,headers:{}}; if(body && !isForm){ opt.headers['Content-Type']='application/json'; if(csrf) opt.headers['X-CSRF-Token']=csrf; opt.body=JSON.stringify(body); }
  if(isForm){ if(csrf) opt.headers['X-CSRF-Token']=csrf; opt.body=body; }
  const r=await fetch(\`\${API}/\${path}\`, opt); if(!r.ok){ throw new Error(await r.text()); } return r.headers.get('content-type')?.includes('application/json') ? r.json() : r.text();
}
function applyTheme(t){ document.documentElement.dataset.theme=t; }
function fmt(tsIso){
  const tz = (me && me.timezone) ? me.timezone : systemTz || Intl.DateTimeFormat().resolvedOptions().timeZone;
  try{ const d=new Date(tsIso); return new Intl.DateTimeFormat(undefined,{hour:'2-digit',minute:'2-digit',second:'2-digit',year:'numeric',month:'2-digit',day:'2-digit',hour12:false,timeZone:tz}).format(d); }
  catch{ return tsIso; }
}
const TZ_LIST = Intl.supportedValuesOf ? Intl.supportedValuesOf('timeZone') : ['UTC','Europe/Berlin','America/New_York','Asia/Tokyo'];

let audioCtx=null;
function ensureAudio(){ if(!audioCtx) audioCtx = new (window.AudioContext||window.webkitAudioContext)(); return audioCtx; }
function beep(freq=880, ms=160, gainPct=70){
  try{
    const ctx=ensureAudio();
    const o=ctx.createOscillator(); const g=ctx.createGain();
    o.type='sine'; o.frequency.value=freq;
    const v = Math.max(0,Math.min(100, gainPct))/100;
    g.gain.value=0.0001; g.gain.setTargetAtTime(v, ctx.currentTime, 0.01);
    o.connect(g).connect(ctx.destination); o.start();
    setTimeout(()=>{ g.gain.setTargetAtTime(0.0001, ctx.currentTime, 0.03); setTimeout(()=>{ o.stop(); o.disconnect(); g.disconnect(); }, 120); }, ms);
  }catch(e){}
}
function playPing(){ if(me && me.sound_ping) beep(1200,180, (me.sound_volume_ping||70)); }
function playBroadcast(){ if(me && me.sound_broadcast) beep(680,220, (me.sound_volume_broadcast||70)); }


const pingAudio = new Audio('data:audio/wav;base64,UklGRiQAAABXQVZFZm10IBAAAAABAAEAESsAACJWAAACABAAZGF0YQwAAAABAQEBAQEBAQEB');
const bcAudio = new Audio('data:audio/wav;base64,UklGRiQAAABXQVZFZm10IBAAAAABAAEAESsAACJWAAACABAAZGF0YQwAAAABAQEBAQIBAQMB');
function playPing(){ if(me && me.sound_ping){ try{ pingAudio.currentTime=0; pingAudio.play(); }catch(e){} } }
function playBroadcast(){ if(me && me.sound_broadcast){ try{ bcAudio.currentTime=0; bcAudio.play(); }catch(e){} } }


/* Toasts */
function toast.info(text, type='info', timeout=4500){
  const wrap = el('toasts');
  const div = document.createElement('div');
  div.className = 'toast '+type;
  div.innerHTML = `<div class="icon">•</div><div class="body">${eh(text)}</div><button class="close" aria-label="Close">×</button>`;
  wrap.appendChild(div);
  const close = ()=>{ div.classList.remove('show'); setTimeout(()=>div.remove(), 180); };
  div.querySelector('.close').onclick = close;
  setTimeout(()=>div.classList.add('show'), 10);
  if(timeout>0) setTimeout(close, timeout);
}

async function refreshMe(){
  const d=await api.get('me.php'); setCsrf(d.csrf); csrf=d.csrf; me=d.user||null; const s=d.settings||{};
  systemTz = s.default_timezone || 'UTC'; systemClosed = !!(s.system_closed*1); shutdownActive = !!(s.shutdown_active*1); shutdownMsg = s.shutdown_message || '';
  const banner=el('shutdown-banner'); if(shutdownActive){ banner.textContent='System is scheduled for shutdown. '+(shutdownMsg||''); banner.classList.remove('hidden'); } else { banner.classList.add('hidden'); }
  const closedNote=el('closed-note'); if(systemClosed){ closedNote.textContent='The system is currently closed (shutdown). '+(shutdownMsg||''); closedNote.classList.remove('hidden'); } else { closedNote.classList.add('hidden'); }
  const tzSel=el('tz-select'); tzSel.innerHTML = TZ_LIST.map(z=>`<option value="${z}">${z}</option>`).join('');
  const saTz=el('sa-default-tz'); if(saTz) saTz.innerHTML = tzSel.innerHTML;
  document.getElementById('sa-pass-policy') && (document.getElementById('sa-pass-policy').value = s.password_policy || 'low');
  document.getElementById('sa-default-tz') && (document.getElementById('sa-default-tz').value = s.default_timezone || 'UTC');
  if(me){
    el('ping-label').classList.remove('hidden'); document.getElementById('notify-pings').checked = !!me.notify_pings; el('sound-ping-label').classList.remove('hidden'); document.getElementById('sound-ping').checked = !!me.sound_ping; el('sound-bc-label').classList.remove('hidden'); document.getElementById('sound-broadcast').checked = !!me.sound_broadcast;
    el('user-label').textContent='@'+me.username; el('user-label').classList.remove('hidden'); el('logout-btn').classList.remove('hidden'); document.getElementById('open-settings').classList.remove('hidden');
    el('auth-card').classList.add('hidden'); el('nav-card').classList.remove('hidden');
    if(me.is_chat_admin||me.is_admin||me.is_super_admin||me.is_global_mod){ el('admin-card').classList.remove('hidden'); }
    if(me.is_super_admin){ el('sa-card').classList.remove('hidden'); }
    el('theme-select').value = (me.theme||'auto'); applyTheme(me.theme||'auto');
    el('tz-select').value = me.timezone || systemTz;
    await refreshRooms();
  } else {
    el('auth-card').classList.remove('hidden'); el('nav-card').classList.add('hidden');
  }
}
async function refreshRooms(){
  const rooms = await api.get('rooms_admin.php?action=list');
  const rc = document.getElementById('rooms'); rc.innerHTML='';
  rooms.forEach(r=>{ const d=document.createElement('div'); d.className='item'; d.textContent='#'+r.name+' (id='+r.id+')'; d.onclick=()=>selectRoom(r.id,r.name,r); rc.appendChild(d); });
  const pick=document.getElementById('bc-rooms'); if(pick){ pick.innerHTML=''; rooms.forEach(r=>{ const o=document.createElement('option'); o.value=r.id; o.textContent='#'+r.name+'  — id='+r.id; pick.appendChild(o); }); }
}
function selectRoom(id,name,rmeta){ currentRoomId=id; currentRoomName=name; document.getElementById('scope-header').textContent='Room: #'+name; startSSE(); }
function startSSE(){
  try{ evtSource && evtSource.close(); }catch{}
  if(!currentRoomId) return; const q=new URLSearchParams({room_id:String(currentRoomId), last_id:String(lastId), ev_last:String(evLast)});
  evtSource=new EventSource(\`\${API}/sse.php?\${q.toString()}\`, {withCredentials:true});
  evtSource.addEventListener('message', e=>{ const m=JSON.parse(e.data); appendMsg(m); lastId=Math.max(lastId,m.id); });
  evtSource.addEventListener('broadcast', e=>{ const d=JSON.parse(e.data); toast.info('[Broadcast] '+(d.text||''), 'warn', 8000); });
  evtSource.addEventListener('ping', e=>{ const d=JSON.parse(e.data); toast.info('You were pinged'+(d.note?': '+d.note:''), 'info', 6000); });
  evtSource.addEventListener('idle_kick', e=>{ const d=JSON.parse(e.data); toast.info('Inactive — you were removed from room (timeout '+(d.timeout_sec)+'s)', 'error', 7000); try{evtSource.close();}catch{}; });
  evtSource.onerror=()=>{ setTimeout(()=>startSSE(), 1000); };
}
function appendMsg(m){
  const mine = me && m.username===me.username;
  const div=document.createElement('div'); div.className='msg '+(mine?'me':'other')+(m.msg_type==='emote'?' emote':'')+(m.msg_type==='system'?' system':'');
  let text = eh(m.text||'');
  if(m.msg_type==='file' && m.attachment_url){
    const url = m.attachment_url;
    const name = m.attachment_name || 'file';
    const ext = (name.split('.').pop()||'').toLowerCase();
    if(['mp4','webm','mov','mkv','avi','mpeg'].includes(ext)){
      text = \`<video src="../\${url}" controls style="max-width:420px;max-height:240px;display:block"></video><div><a href="../\${url}" target="_blank">\${eh(name)}</a></div>\`;
    } else if(['png','jpg','jpeg','gif','webp'].includes(ext)){
      text = \`<img src="../\${url}" alt="\${eh(name)}" style="max-width:420px;max-height:240px;display:block"/><div><a href="../\${url}" target="_blank">\${eh(name)}</a></div>\`;
    } else {
      text = \`<a href="../\${url}" target="_blank">\${eh(name)}</a>\`;
    }
  }
  div.innerHTML=\`<div class='meta'>[\${fmt(m.created_at_utc)}] &lt;\${eh(m.username)}&gt; #\${eh(m.room_name||'')}</div><div class='text'>\${text}</div>\`;
  chat.appendChild(div); chat.scrollTop=chat.scrollHeight;
}

// SA: shutdown toggle
const saBtn=document.getElementById('sa-shutdown');
saBtn && saBtn.addEventListener('click', async()=>{
  const seconds = parseInt((document.getElementById('sa-shutdown-sec').value||'0'),10) || 0;
  const message = document.getElementById('sa-shutdown-msg').value || '';
  try{
    await api.post('shutdown.php', {action:'toggle',seconds,message});
    toast.info(seconds>0 ? 'Shutdown scheduled' : 'Shutdown initiated', 'warn', 6000);
    saBtn.classList.toggle('primary');
  }catch(e){ toast.info('Error toggling shutdown: '+e.message, 'error', 8000); }
});
// SA: scheduled tick (every 10s)
setInterval(async()=>{ try{ await api.post('shutdown.php', {action:'tick'}); }catch{} }, 10000);

// Theme + timezone select (user)
document.getElementById('theme-select').addEventListener('change', async (e)=>{
  const v=e.target.value; applyTheme(v);
  try{ await api.post('profile.php?action=update', {theme:v}); toast.info('Theme saved','success'); } catch { toast.info('Failed to save theme','error'); }
});
document.getElementById('tz-select').addEventListener('change', async (e)=>{
  const v=e.target.value;
  try{ await api.post('profile.php?action=update', {timezone:v}); toast.info('Timezone saved','success'); } catch { toast.info('Failed to save timezone','error'); }
});
document.getElementById('notify-pings')?.addEventListener('change', async (e)=>{
  try{ await api.post('profile.php?action=update', {notify_pings: e.target.checked}); toast.info('Ping preference saved','success'); } catch { toast.info('Failed to save ping preference','error'); }
});

document.getElementById('sound-ping')?.addEventListener('change', async (e)=>{ try{ await api.post('profile.php?action=update',{sound_ping: e.target.checked}); toast.success('Ping sound saved'); }catch{} });
document.getElementById('sound-broadcast')?.addEventListener('change', async (e)=>{ try{ await api.post('profile.php?action=update',{sound_broadcast: e.target.checked}); toast.success('Broadcast sound saved'); }catch{} });
document.getElementById('vol-ping')?.addEventListener('change', async (e)=>{ try{ await api.post('profile.php?action=update',{sound_volume_ping: parseInt(e.target.value,10)}); toast.success('Ping volume saved'); }catch{} });
document.getElementById('vol-bc')?.addEventListener('change', async (e)=>{ try{ await api.post('profile.php?action=update',{sound_volume_broadcast: parseInt(e.target.value,10)}); toast.success('Broadcast volume saved'); }catch{} });
// Broadcast UI
const modal=document.getElementById('broadcast-modal'); const roomPicker=document.getElementById('bc-room-picker'); const roomsSel=document.getElementById('bc-rooms');
function openBroadcast(){
  const isGmod = !!(me && me.is_global_mod && !me.is_chat_admin && !me.is_admin && !me.is_super_admin);
  document.querySelector('input[name="bc-mode"][value="all_users"]').disabled = isGmod;
  if(isGmod){ document.querySelector('input[name="bc-mode"][value="all_rooms"]').checked = true; roomPicker.style.display='none'; }
  modal.classList.add('open');
}
function closeBroadcast(){ modal.classList.remove('open'); document.getElementById('bc-text').value=''; }
document.getElementById('adm-broadcast').onclick=openBroadcast;
document.getElementById('bc-cancel').onclick=closeBroadcast;
document.querySelectorAll('input[name="bc-mode"]').forEach(r=>r.addEventListener('change',()=>{
  roomPicker.style.display = document.querySelector('input[name="bc-mode"][value="rooms"]').checked ? 'block' : 'none';
}));
document.getElementById('bc-send').onclick=async()=>{
  const txt=document.getElementById('bc-text').value.trim(); if(!txt) return toast.info('Enter text', 'warn');
  let mode=document.querySelector('input[name="bc-mode"]:checked').value;
  const body={ text: txt, mode };
  if(mode==='rooms'){
    const ids=[...roomsSel.selectedOptions].map(o=>parseInt(o.value,10)).filter(Boolean); if(ids.length===0) return toast.info('Pick rooms','warn');
    body.rooms=ids;
  }
  try{ await api('broadcast.php','POST', body); toast.info('Broadcast sent','success'); closeBroadcast(); }catch(e){ toast.info('Error: '+e.message, 'error', 8000); }
};

// Room editor modal (Chat Admin+ full, Owner limited)
const rmodal=document.getElementById('room-modal'); let openRoomEditorPrefill=null;
document.getElementById('adm-room-editor').onclick=()=>{
  if(!currentRoomId){ return toast.info('Open a room first','warn'); }
  openRoomEditor(openRoomEditorPrefill);
};
function openRoomEditor(meta){
  rmodal.classList.add('open');
  document.getElementById('room-modal-title').textContent=' — #'+(currentRoomName||'');
  document.getElementById('rm-name').value = meta?.name || currentRoomName || '';
  document.getElementById('rm-info').value = meta?.info_line || '';
  document.getElementById('rm-invisible').checked = !!meta?.invisible;
  document.getElementById('rm-age').value = meta?.age_min ?? 0;
  document.getElementById('rm-attach-exempt').checked = !!meta?.attach_limit_exempt;
  document.getElementById('rm-attach-override').value = meta?.attach_size_override_mb ?? '';
  document.getElementById('rm-inact-exempt').checked = !!meta?.inactivity_exempt;
  document.getElementById('rm-inact-min').value = Math.floor((meta?.inactivity_timeout_sec||0)/60);
  const isCA = !!(me && (me.is_chat_admin||me.is_admin||me.is_super_admin));
  document.getElementById('rm-attach-exempt').disabled = !isCA;
  document.getElementById('rm-inact-exempt').disabled = !isCA;
}
document.getElementById('rm-cancel').onclick=()=>{ rmodal.classList.remove('open'); };
document.getElementById('rm-save').onclick=async()=>{
  const body={ room_id: currentRoomId, name: document.getElementById('rm-name').value, info_line: document.getElementById('rm-info').value,
    invisible: document.getElementById('rm-invisible').checked, age_min: parseInt(document.getElementById('rm-age').value||'0',10),
    attach_limit_exempt: document.getElementById('rm-attach-exempt').checked, attach_size_override_mb: parseInt(document.getElementById('rm-attach-override').value||'0',10),
    inactivity_exempt: document.getElementById('rm-inact-exempt').checked, inactivity_timeout_sec: parseInt(document.getElementById('rm-inact-min').value||'0',10)*60
  };
  try{ await api('rooms_admin.php?action=update','POST', body); toast.info('Room saved','success'); rmodal.classList.remove('open'); refreshRooms(); }catch(e){ toast.info('Error: '+e.message, 'error', 8000); }
};

// Send message or attachment
document.getElementById('send-btn').onclick=async()=>{
  if(!currentRoomId) return toast.info('Pick a room','warn');
  const file=document.getElementById('file').files[0];
  if(file){
    const fd=new FormData(); fd.append('room_id', String(currentRoomId)); fd.append('file', file);
    try{ await api.postForm('chat_send.php', fd); document.getElementById('file').value=''; toast.info('File uploaded','success'); }catch(e){ toast.info('Upload failed: '+e.message, 'error', 8000); }
  }
  const t=document.getElementById('message').value; 
  if(t.trim()){
    try{ await api.post('chat_send.php', {room_id: currentRoomId, text: t}); document.getElementById('message').value=''; } catch(e){ toast.info('Send failed: '+e.message, 'error', 8000); }
  }
};


// Settings modal logic
const settingsModal = document.getElementById('settings-modal');
document.getElementById('open-settings').addEventListener('click', ()=>{ 
  // preload values from current `me`
  document.getElementById('us-notify-pings').checked = !!(me && me.notify_pings);
  document.getElementById('us-sound-ping').checked = !!(me && me.sound_ping);
  document.getElementById('us-sound-bc').checked = !!(me && me.sound_broadcast);
  document.getElementById('us-vol-ping').value = (me && (me.sound_volume_ping??70)) || 70;
  document.getElementById('us-vol-bc').value = (me && (me.sound_volume_broadcast??70)) || 70;
  // Theme
  const themeSel = document.getElementById('us-theme');
  themeSel.value = (me && me.theme) ? me.theme : 'auto';
  // Timezone: build list once, then select
  const tzSel = document.getElementById('us-timezone');
  if(!tzSel.dataset.built){
    tzSel.innerHTML = TZ_LIST.map(z=>`<option value="${z}">${z}</option>`).join('');
    tzSel.dataset.built='1';
  }
  tzSel.value = (me && me.timezone) ? me.timezone : (systemTz||'UTC');
  settingsModal.classList.add('open');
});
document.getElementById('settings-close').addEventListener('click', ()=> settingsModal.classList.remove('open'));
document.getElementById('us-test-ping').addEventListener('click', ()=>{
  const v = parseInt(document.getElementById('us-vol-ping').value||'70',10);
  beep(1200,180, v);
});
document.getElementById('us-test-bc').addEventListener('click', ()=>{
  const v = parseInt(document.getElementById('us-vol-bc').value||'70',10);
  beep(680,220, v);
});
document.getElementById('us-save').addEventListener('click', async()=>{
  try{
    const payload = {
      notify_pings: document.getElementById('us-notify-pings').checked,
      sound_ping: document.getElementById('us-sound-ping').checked,
      sound_broadcast: document.getElementById('us-sound-bc').checked,
      sound_volume_ping: parseInt(document.getElementById('us-vol-ping').value||'70',10),
      sound_volume_broadcast: parseInt(document.getElementById('us-vol-bc').value||'70',10),
    };
    await api.post('profile.php?action=update', payload);
    // mirror into live `me` so it takes effect immediately
    me.notify_pings = !!payload.notify_pings;
    me.sound_ping = !!payload.sound_ping;
    me.sound_broadcast = !!payload.sound_broadcast;
    me.sound_volume_ping = payload.sound_volume_ping;
    me.sound_volume_broadcast = payload.sound_volume_broadcast;
    // sync header sliders
    const vp = document.getElementById('vol-ping'); if(vp) vp.value = payload.sound_volume_ping;
    const vb = document.getElementById('vol-bc'); if(vb) vb.value = payload.sound_volume_broadcast;
    document.getElementById('notify-pings').checked = !!payload.notify_pings;
    document.getElementById('sound-ping').checked = !!payload.sound_ping;
    document.getElementById('sound-broadcast').checked = !!payload.sound_broadcast;
    toast.success('Settings saved');
    settingsModal.classList.remove('open');
  }catch(e){ /* toast from api */ }
});
// Header test buttons
document.getElementById('btn-test-ping')?.addEventListener('click', ()=>{ const v=parseInt(document.getElementById('vol-ping').value||'70',10); beep(1200,180,v); });
document.getElementById('btn-test-bc')?.addEventListener('click', ()=>{ const v=parseInt(document.getElementById('vol-bc').value||'70',10); beep(680,220,v); });

// Periodic shutdown tick (every 10s)
setInterval(async()=>{ try{ await api.post('shutdown.php', {action:'tick'}); }catch{} }, 10000);

(async()=>{ await refreshMe(); })();
</script>
