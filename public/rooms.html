<!doctype html>
<html lang="en" data-theme="auto">
<head>
  <meta charset="utf-8"><meta name="viewport" content="width=device-width, initial-scale=1">
  <title>ChitChat — Room Editor</title>
  <link rel="preconnect" href="." />
  <style>
    :root{ --bg:#0b0c10; --panel:#111827; --panel2:#0f172a; --border:#1f2937; --fg:#e5e7eb; --muted:#9ca3af; }
    [data-theme="light"]{ --bg:#f7fafc; --panel:#ffffff; --panel2:#f1f5f9; --border:#e5e7eb; --fg:#0f172a; --muted:#475569; }
    body{ margin:0; font-family: system-ui,-apple-system,Segoe UI,Roboto,Ubuntu; background:var(--bg); color:var(--fg); }
    header{ padding:10px 14px; background:var(--panel); border-bottom:1px solid var(--border); display:flex; align-items:center; justify-content:space-between; }
    .wrap{ max-width:1100px; margin:0 auto; padding:14px; }
    .card{ background:var(--panel); border:1px solid var(--border); border-radius:12px; padding:12px; margin-bottom:12px; }
    input,select,button{ font-size:14px; padding:8px 10px; border-radius:8px; border:1px solid #374151; background:var(--bg); color:var(--fg); }
    button{ cursor:pointer }
    table{ width:100%; border-collapse: collapse; }
    th,td{ border-bottom:1px solid var(--border); padding:8px; text-align:left; }
  </style>
</head>
<body>
<header>
  <div><strong>ChitChat — Rooms</strong></div>
  <nav><a href="./index.html" style="color:var(--fg); text-decoration:none">Back to app</a></nav>
</header>
<div class="wrap">
  <div class="card">
    <div style="display:flex; gap:8px; flex-wrap:wrap; align-items:center">
      <input id="new-room-name" placeholder="New room name">
      <button id="btn-create">Create</button>
      <input id="filter" placeholder="Filter…">
    </div>
  </div>
  <div class="card">
    <table id="room-table">
      <thead><tr><th>ID</th><th>Name</th><th>Info</th><th>Invisible</th><th>Min Age</th><th>Actions</th></tr></thead>
      <tbody></tbody>
    </table>
  </div>
</div>
<script type="module">
import { toast } from './js/toast.js';
import { api, setCsrf } from './js/api.js';
import { $, $$, openModal, closeModal, formToJSON, confirmDialog } from './js/ui.js';

async function me(){ const d=await api.get('me.php'); setCsrf(d.csrf); return d; }
let perms=null;

function rowTemplate(r){
  const tr=document.createElement('tr');
  tr.innerHTML=`<td>${r.id}</td>
    <td><input value="${r.name}"></td>
    <td><input value="${r.info_line||''}"></td>
    <td><input type="checkbox" ${r.invisible?'checked':''}></td>
    <td><input type="number" min="0" value="${r.age_min||0}" style="width:90px"></td>
    <td>
      <button class="save">Save</button>
      <button class="delete">Delete</button>
    </td>`;
  tr.querySelector('.save').onclick=async()=>{
    const [name,info,invis,age] = [
      tr.children[1].querySelector('input').value.trim(),
      tr.children[2].querySelector('input').value.trim(),
      tr.children[3].querySelector('input').checked,
      parseInt(tr.children[4].querySelector('input').value||'0',10)
    ];
    try{
      await api.post('rooms_admin.php?action=update',{room_id:r.id,name,info_line:info,invisible:invis,age_min:age});
      toast.success('Saved');
    }catch(e){}
  };
  tr.querySelector('.delete').onclick=()=>{
    confirmDialog(`Delete room #${r.id} (${r.name})?`, async()=>{
      try{ await api.post('rooms_admin.php?action=delete',{room_id:r.id}); tr.remove(); toast.success('Deleted'); }catch(e){}
    });
  };
  return tr;
}

async function loadRooms(){
  const rooms = await api.get('rooms_admin.php?action=list');
  const tbody = $('#room-table tbody'); tbody.innerHTML='';
  rooms.forEach(r=> tbody.appendChild(rowTemplate(r)) );
}

document.getElementById('btn-create').onclick=async()=>{
  const name = document.getElementById('new-room-name').value.trim(); if(!name) return toast.warn('Enter a name');
  try{
    await api.post('rooms_admin.php?action=create',{name});
    document.getElementById('new-room-name').value='';
    await loadRooms();
    toast.success('Room created');
  }catch(e){}
};

(async()=>{
  const d=await me();
  perms = d.user||{};
  if(!(perms.is_chat_admin||perms.is_admin||perms.is_super_admin)){
    toast.error('Forbidden'); setTimeout(()=>location.href='index.html', 800); return;
  }
  await loadRooms();
})();
</script>
</body>
</html>
