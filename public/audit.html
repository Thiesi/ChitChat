<!doctype html>
<html lang="en" data-theme="auto">
<head>
  <meta charset="utf-8"><meta name="viewport" content="width=device-width, initial-scale=1">
  <title>ChitChat — Login Audit</title>
  <style>
    :root{ --bg:#0b0c10; --panel:#111827; --panel2:#0f172a; --border:#1f2937; --fg:#e5e7eb; --muted:#9ca3af; }
    [data-theme="light"]{ --bg:#f7fafc; --panel:#ffffff; --panel2:#f1f5f9; --border:#e5e7eb; --fg:#0f172a; --muted:#475569; }
    body{ margin:0; font-family: system-ui,-apple-system,Segoe UI,Roboto,Ubuntu; background:var(--bg); color:var(--fg); }
    header{ padding:10px 14px; background:var(--panel); border-bottom:1px solid var(--border); display:flex; align-items:center; justify-content:space-between; }
    .wrap{ max-width:1200px; margin:0 auto; padding:14px; }
    .card{ background:var(--panel); border:1px solid var(--border); border-radius:12px; padding:12px; margin-bottom:12px; }
    input,select,button{ font-size:14px; padding:8px 10px; border-radius:8px; border:1px solid #374151; background:var(--bg); color:var(--fg); }
    button{ cursor:pointer }
    table{ width:100%; border-collapse: collapse; }
    th,td{ border-bottom:1px solid var(--border); padding:8px; text-align:left; }
    .row{ display:flex; gap:8px; flex-wrap:wrap; align-items:center }
  </style>
</head>
<body>
<header>
  <div><strong>ChitChat — Login Audit</strong></div>
  <nav><a href="./index.html" style="color:var(--fg); text-decoration:none">Back</a></nav>
</header>
<div class="wrap">
  <div class="card">
    <div class="row">
      <input id="q-user" placeholder="@username (optional)">
      <input id="q-ip" placeholder="IP (optional)">
      <input id="q-from" type="date">
      <input id="q-to" type="date">
      <select id="q-ok">
        <option value="">all</option>
        <option value="1">ok only</option>
        <option value="0">fail only</option>
      </select>
      <input id="q-limit" type="number" value="200" style="width:120px">
      <button id="btn-fetch">Fetch</button>
      <button id="btn-export">Export CSV</button>
    </div>
  </div>
  <div class="card">
    <table>
      <thead><tr><th>Time</th><th>Username</th><th>IP</th><th>Reason</th><th>OK</th></tr></thead>
      <tbody id="rows"></tbody>
    </table>
  </div>
</div>
<script type="module">
import { toast } from './js/toast.js';
import { api, setCsrf } from './js/api.js';
let CSRF=null;

const $ = sel => document.querySelector(sel);
function row(r){
  const tr=document.createElement('tr');
  tr.innerHTML = `<td>${r.created_at}</td><td>${r.username||''}</td><td>${r.ip||''}</td><td>${r.reason||''}</td><td>${r.ok?'✓':'✗'}</td>`;
  return tr;
}
async function me(){ const d=await api.get('me.php'); setCsrf(d.csrf); CSRF=d.csrf; return d; }

$('#btn-fetch').onclick = async()=>{
  try{
    const q={ username:$('#q-user').value.replace(/^@/,''), ip:$('#q-ip').value, from:$('#q-from').value, to:$('#q-to').value, ok:$('#q-ok').value, limit: parseInt($('#q-limit').value||'200',10) };
    const rows = await api.post('audit_admin.php?action=list', q);
    const tb = $('#rows'); tb.innerHTML=''; rows.forEach(r=> tb.appendChild(row(r)));
    toast.success(`Loaded ${rows.length}`);
  }catch(e){}
};
$('#btn-export').onclick = async()=>{
  try{
    const q={ username:$('#q-user').value.replace(/^@/,''), ip:$('#q-ip').value, from:$('#q-from').value, to:$('#q-to').value, ok:$('#q-ok').value };
    const params = new URLSearchParams({ action:'export_csv', csrf: CSRF });
    Object.entries(q).forEach(([k,v])=>{ if(v!=='' && v!=null) params.append(k, v); });
    const url = `../backend/audit_admin.php?${params.toString()}`;
    window.open(url, '_blank');
  }catch(e){}
};

(async()=>{
  const d=await me(); const u=d.user||{};
  if(!(u.is_admin||u.is_super_admin)){ toast.error('Forbidden'); setTimeout(()=>location.href='index.html', 800); return; }
})();
</script>
</body>
</html>
